name: build-macos-linux

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target_name: linux
          - os: macos-latest
            target_name: macos
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Linux build dependencies
        if: matrix.target_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            libjavascriptcoregtk-4.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm -C apps/client tauri build

      - name: Prepare artifact payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -d apps/client/src-tauri/target/release/bundle ]; then
            cp -r apps/client/src-tauri/target/release/bundle/* out/ || true
          fi
          while IFS= read -r bin; do
            base="$(basename "$bin")"
            cp "$bin" "out/${base}-${{ matrix.target_name }}"
          done < <(
            find . -type f -path "*/target/release/*" -perm -111 \
              ! -path "*/deps/*" \
              ! -path "*/build/*" \
              ! -path "*/incremental/*"
          )
          if [ -z "$(ls -A out)" ]; then
            echo "No build artifacts found in expected locations."
            find . -type f -path "*/target/release/*" | head -n 200
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxshare-${{ matrix.target_name }}
          path: out
          if-no-files-found: error
